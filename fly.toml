# fly.toml app configuration file generated for whatsapp-ai-bot-zqkxlq on 2026-11-05T06:01:12Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'whatsapp-ai-bot-zqkxlq'
primary_region = 'ams'

[build]
[env]
  PORT = '3000'

[[mounts]]
  source = 'bot_data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
