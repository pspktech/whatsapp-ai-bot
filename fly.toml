app = "whatsapp-ai-bot-madhu" # Nee ishtam vachina peru (unique ga undali)
primary_region = "bom" # Mumbai

[build]

[env]
  PORT = "3000"

[[mounts]]
  source = "bot_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
